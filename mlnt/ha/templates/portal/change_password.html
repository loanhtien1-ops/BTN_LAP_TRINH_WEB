{% extends "base.html" %}
{% block title %}Đổi mật khẩu cá nhân{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="card-title fw-bold mb-0"><i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu tài khoản</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                            <input type="password" name="old_password" class="form-control" required placeholder="Nhập mật khẩu đang dùng...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mật khẩu mới <span class="text-danger">*</span></label>
                            <input type="password" name="new_password" class="form-control" minlength="6" required placeholder="Tối thiểu 6 ký tự...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                            <input type="password" name="confirm_password" class="form-control" minlength="6" required placeholder="Nhập lại mật khẩu mới...">
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-bold"><i class="bi bi-check2-circle me-1"></i>Lưu mật khẩu mới</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
