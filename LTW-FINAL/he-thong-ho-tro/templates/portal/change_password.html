{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">Đổi <em class="hl">mật khẩu</em></h1>
    <div class="page-sub">Mật khẩu mới cần tối thiểu 6 ký tự.</div>
  </div>
</div>
<form method="post" class="card" style="max-width:520px">
  <div class="field">
    <label class="lbl" for="old_password">Mật khẩu hiện tại</label>
    <input class="input" type="password" id="old_password" name="old_password" required autocomplete="current-password">
  </div>
  <div class="field">
    <label class="lbl" for="new_password">Mật khẩu mới</label>
    <input class="input" type="password" id="new_password" name="new_password" required minlength="6" autocomplete="new-password">
  </div>
  <div class="field">
    <label class="lbl" for="confirm_password">Nhập lại mật khẩu mới</label>
    <input class="input" type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password">
  </div>
  <button class="btn" type="submit"><i class="bi bi-key"></i> Đổi mật khẩu</button>
</form>
{% endblock %}
